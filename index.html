<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be Mine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Enhanced CSS */
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a8edea 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: float 10s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideIn 1s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .above-text {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 40px;
            font-weight: 500;
            line-height: 1.4;
        }
        .buttons {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .yes-btn {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.3rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
        }
        .yes-btn:active {
            transform: scale(0.95);
        }
        .no-btn {
            background: linear-gradient(45deg, #f44336, #e57373);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.3rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .no-btn:hover {
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.5);
        }
        .no-btn:active {
            transform: scale(0.95);
        }
        .success {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            animation: fadeIn 1s ease-in;
        }
        .success h1 {
            font-size: 3.5rem;
            color: #ff5722;
            margin-bottom: 20px;
        }
        .success p {
            font-size: 1.4rem;
            margin: 15px 0;
            color: #333;
        }
        .small-text {
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
            margin: 10px 0;
        }
        .reset-btn {
            margin-top: 20px;
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
        }
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ff5722;
            animation: fall 4s linear infinite;
            border-radius: 50%;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .above-text {
                font-size: 1.1rem;
            }
            .yes-btn, .no-btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
            .buttons {
                flex-direction: column;
                gap: 20px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg">
        <!-- Floating hearts -->
        <div class="heart" style="left: 10%; animation-delay: 0s;">❤️</div>
        <div class="heart" style="left: 20%; animation-delay: 2s;">💖</div>
        <div class="heart" style="left: 30%; animation-delay: 4s;">💕</div>
        <div class="heart" style="left: 40%; animation-delay: 6s;">❤️</div>
        <div class="heart" style="left: 50%; animation-delay: 8s;">💖</div>
        <div class="heart" style="left: 60%; animation-delay: 1s;">💕</div>
        <div class="heart" style="left: 70%; animation-delay: 3s;">❤️</div>
        <div class="heart" style="left: 80%; animation-delay: 5s;">💖</div>
        <div class="heart" style="left: 90%; animation-delay: 7s;">💕</div>
    </div>
    <div id="root"></div>

    <!-- Optional background music (uncomment and add your MP3) -->
    <!-- <audio autoplay loop>
        <source src="romantic-song.mp3" type="audio/mpeg">
    </audio> -->

    <!-- React and Babel via CDN -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Inline JSX/React Code -->
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [noText, setNoText] = useState('No');
            const [aboveText, setAboveText] = useState("Don't dare to click no varnaa!!");
            const [hoverCount, setHoverCount] = useState(0);
            const [buttonPosition, setButtonPosition] = useState({ top: '50%', left: '50%' });
            const [showSuccess, setShowSuccess] = useState(false);
            const [showConfetti, setShowConfetti] = useState(false);
            const [noButtonVisible, setNoButtonVisible] = useState(true);

            const noTexts = [
                'No',
                'Are you sure?',
                'Really?',
                'Think again!',
                "Don't be silly",
                'Give it a chance!',
                'Please',
                'You might regret this!',
                'Are you certain?',
                'Last chance!',
                'One chance!'
            ];

            const aboveTexts = [
                "Don't dare to click no varnaa!!",
                'Aree aisa maat karo 😘',
                'Think about it 🥺',
                'Come on, say yes! 💕',
                "You're breaking my heart 😢",
                'Please reconsider 🙏',
                'You might regret this! 😱',
                'Are you certain? 🤔',
                'Last chance! ⏰',
                'One chance! 🎯'
            ];

            const handleNoHover = () => {
                if (hoverCount < noTexts.length - 1) {
                    const newCount = hoverCount + 1;
                    setHoverCount(newCount);
                    setNoText(noTexts[newCount]);
                    setAboveText(aboveTexts[newCount] || aboveTexts[aboveTexts.length - 1]);

                    // Move button randomly far away (wider range: 10-90%)
                    const randomTop = Math.random() * 80 + 10;
                    const randomLeft = Math.random() * 80 + 10;
                    setButtonPosition({ top: `${randomTop}%`, left: `${randomLeft}%` });
                } else {
                    setNoButtonVisible(false);
                }
            };

            const handleYesClick = () => {
                setShowConfetti(true);
                setTimeout(() => {
                    setShowConfetti(false);
                    setShowSuccess(true);
                }, 4000); // Longer confetti for drama
            };

            const handleReset = () => {
                setShowSuccess(false);
                setNoText('No');
                setAboveText("Don't dare to click no varnaa!!");
                setHoverCount(0);
                setButtonPosition({ top: '50%', left: '50%' });
                setNoButtonVisible(true);
            };

            if (showSuccess) {
                return (
                    <div className="container success">
                        <h1>Yay! 🎉</h1>
                        <p>You just made me the happiest person alive!</p>
                        <p className="small-text">This is just the beginning of our beautiful journey together....</p>
                        <p className="small-text">Forever and always 💕</p>
                        <button className="reset-btn" onClick={handleReset}>Reset (for testing)</button>
                    </div>
                );
            }

            return (
                <div className="container">
                    {showConfetti && (
                        <div className="confetti">
                            {/* Enhanced confetti pieces */}
                            {Array.from({ length: 100 }, (_, i) => (
                                <div
                                    key={i}
                                    className="confetti-piece"
                                    style={{
                                        left: `${Math.random() * 100}%`,
                                        animationDelay: `${Math.random() * 4}s`,
                                        width: `${Math.random() * 10 + 5}px`,
                                        height: `${Math.random() * 10 + 5}px`,
                                        backgroundColor: ['#ff5722', '#4caf50', '#2196f3', '#ffeb3b', '#e91e63'][Math.floor(Math.random() * 5)]
                                    }}
                                ></div>
                            ))}
                        </div>
                    )}
                    <h1>Will you be mine?</h1>
                    <p className="above-text">{aboveText}</p>
                    <div className="buttons">
                        <button className="yes-btn" onClick={handleYesClick}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                            Yes
                        </button>
                        {noButtonVisible && (
                            <button
                                className="no-btn"
                                onMouseEnter={handleNoHover}
                                onClick={handleNoHover}
                                style={{
                                    top: buttonPosition.top,
                                    left: buttonPosition.left
                                }}
                            >
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                </svg>
                                {noText}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
